<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EM Wave Propagation - Mobile Fixed</title>
    <style>
        :root {
            --primary: #d97757;
            --secondary: #374151;
            --bg: #fcfbfa;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px; /* Reduced padding for mobile */
        }

        .container { max-width: 1100px; width: 100%; }

        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 8px; color: var(--text); }
        p.subtitle { color: var(--text-light); font-size: 0.95rem; max-width: 600px; margin: 0 auto; line-height: 1.4; }

        .visualization-card {
            background: var(--card-bg); border-radius: 16px;
            box-shadow: 0 4px 20px -5px rgba(0,0,0,0.08);
            border: 1px solid var(--border); padding: 15px; margin-bottom: 20px; position: relative;
        }

        canvas { width: 100%; height: 300px; display: block; border-radius: 8px; background: #fafafa; cursor: crosshair; }

        .legend { display: flex; justify-content: center; gap: 15px; margin-top: 15px; font-size: 0.8rem; font-weight: 600; color: var(--text-light); flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.e { background: var(--primary); }
        .dot.b { background: var(--secondary); }
        .dot.k { background: #d1d5db; }

        .controls-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            background: var(--card-bg); padding: 20px; border-radius: 16px;
            border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .label-row { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-light); }
        .val-display { color: var(--primary); font-family: monospace; font-size: 0.85rem; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: var(--primary); cursor: pointer; margin-top: -8px;
            box-shadow: 0 2px 6px rgba(217, 119, 87, 0.4);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #e5e7eb; border-radius: 2px; }

        .actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        button { padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; border: none; flex: 1; max-width: 120px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #f3f4f6; color: var(--text); }

        @media (min-width: 768px) {
            h1 { font-size: 2.5rem; }
            .controls-grid { grid-template-columns: repeat(4, 1fr); }
            canvas { height: 450px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Electromagnetic Wave</h1>
            <p class="subtitle">Interactive visualization of orthogonal E and B fields.</p >
        </header>

        <div class="visualization-card">
            <canvas id="simCanvas"></canvas>
            <div class="legend">
                <div class="legend-item"><div class="dot e"></div> Electric Field (E)</div>
                <div class="legend-item"><div class="dot b"></div> Magnetic Field (B)</div>
                <div class="legend-item"><div class="dot k"></div> Propagation (k)</div>
            </div>
        </div>

        <div class="controls-grid">
            <div class="control-group">
                <div class="label-row"><label>Frequency</label><span class="val-display" id="freqVal">0.5 Hz</span></div>
                <input type="range" id="freq" min="0.1" max="3.0" step="0.1" value="0.5">
            </div>
            <div class="control-group">
                <div class="label-row"><label>Amplitude</label><span class="val-display" id="ampVal">1.0</span></div>
                <input type="range" id="amp" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <div class="label-row"><label>Wavelength</label><span class="val-display" id="lambdaVal">3.0 m</span></div>
                <input type="range" id="lambda" min="1.0" max="10.0" step="0.5" value="3.0">
            </div>
            <div class="control-group">
                <div class="label-row"><label>Speed</label><span class="val-display" id="speedVal">0.5 c</span></div>
                <input type="range" id="speed" min="0.1" max="2.0" step="0.1" value="0.5">
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" id="playBtn">▶ Play</button>
            <button class="btn-secondary" id="pauseBtn">Pause</button>
            <button class="btn-secondary" id="resetBtn">Reset</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        draw();
    }
    window.addEventListener('resize', resize);

    let params = { f: 0.5, a: 1.0, l: 3.0, v: 0.5 }; 
    let time = 0;
    let isPlaying = true;

    const C_E = '#d97757';
    const C_B = '#374151';
    const C_AXIS = '#e5e7eb';

    function draw() {
        const w = canvas.width / (window.devicePixelRatio || 1);
        const h = canvas.height / (window.devicePixelRatio || 1);
        const cy = h / 2;
        
        ctx.clearRect(0, 0, w, h);

        // SMART ZOOM: Adjust visual scale based on screen width
        // On mobile (w < 500), we stretch the wave so it fits nicely
        const isMobile = w < 500;
        const visualLambda = isMobile ? params.l * (w / 400) : params.l; 
        
        const k = (2 * Math.PI) / visualLambda;
        const omega = 2 * Math.PI * params.f;
        
        // Adjust amplitude to fit screen height
        const maxAmp = (h / 2) * 0.8; 
        const ampPx = Math.min(params.a * 80, maxAmp); 
        
        const steps = 200; 
        const startX = 20;
        const endX = w - 20;
        const dx = (endX - startX) / steps;

        // Draw Axis
        ctx.beginPath();
        ctx.strokeStyle = C_AXIS;
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.moveTo(startX, cy);
        ctx.lineTo(endX, cy);
        ctx.stroke();
        ctx.setLineDash([]);

        // Magnetic Field (B) - Dark Gray
        ctx.beginPath();
        ctx.strokeStyle = C_B;
        ctx.lineWidth = 2;
        for (let i = 0; i <= steps; i++) {
            const x = startX + i * dx;
            const phase = k * (i * dx) - omega * time;
            const val = Math.sin(phase);
            const y = cy + (val * ampPx * 0.35); 
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // B Vectors (Ellipses)
        ctx.fillStyle = C_B;
        for (let i = 0; i <= steps; i += 10) {
            const x = startX + i * dx;
            const phase = k * (i * dx) - omega * time;
            const val = Math.sin(phase);
            const y = cy + (val * ampPx * 0.35);
            ctx.beginPath();
            ctx.ellipse(x, y, 3, 1.5, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // Electric Field (E) - Orange
        ctx.beginPath();
        ctx.strokeStyle = C_E;
        ctx.lineWidth = 3;
        for (let i = 0; i <= steps; i++) {
            const x = startX + i * dx;
            const phase = k * (i * dx) - omega * time;
            const val = Math.sin(phase);
            const y = cy - (val * ampPx);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // E Vectors (Vertical Lines)
        for (let i = 0; i <= steps; i += 8) {
            const x = startX + i * dx;
            const phase = k * (i * dx) - omega * time;
            const val = Math.sin(phase);
            const yEnd = cy - (val * ampPx);
            if (Math.abs(val) > 0.1) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(217, 119, 87, ${Math.abs(val) * 0.4})`;
                ctx.lineWidth = 1;
                ctx.moveTo(x, cy);
                ctx.lineTo(x, yEnd);
                ctx.stroke();
            }
        }

        // Labels
        ctx.font = "bold 12px sans-serif";
        ctx.fillStyle = C_E;
        ctx.fillText("E", 5, cy - ampPx - 5);
        ctx.fillStyle = C_B;
        ctx.fillText("B", 5, cy + (ampPx * 0.35) + 15);
    }

    function loop() {
        if (isPlaying) {
            time += 0.03 * params.v;
            draw();
        }
        requestAnimationFrame(loop);
    }

    const bindSlider = (id, paramKey, displayId, suffix) => {
        const el = document.getElementById(id);
        const disp = document.getElementById(displayId);
        el.addEventListener('input', (e) => {
            params[paramKey] = parseFloat(e.target.value);
            disp.innerText = params[paramKey].toFixed(1) + suffix;
            if (!isPlaying) draw();
        });
    };

    bindSlider('freq', 'f', 'freqVal', ' Hz');
    bindSlider('amp', 'a', 'ampVal', '');
    bindSlider('lambda', 'l', 'lambdaVal', ' m');
    bindSlider('speed', 'v', 'speedVal', ' c');

    document.getElementById('playBtn').onclick = () => { isPlaying = true; };
    document.getElementById('pauseBtn').onclick = () => { isPlaying = false; };
    document.getElementById('resetBtn').onclick = () => { time = 0; isPlaying = false; draw(); };

    setTimeout(() => { resize(); loop(); }, 100);
</script>
</body>
</html>
